</head>

                <p>• Оплата картой или наличными.</p>
            </div>
            <div>
                <h2>Связаться с нами</h2>
                <p>📍 ул. Цветочная, дом 1</p>
                <p>📞 +7 (999) 000-00-00</p>

                <button class="btn" style="width: 100%;">Отправить вопрос</button>
            </div>
        </div>
    </main>
    <script src="script.js"></script>

</html>
