<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Floristé — Главная</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="header-placeholder"></header>

    <!-- Изменили color: #fff на color: #000 -->
    <section style="height: 60vh; background: url('https://unsplash.com') center/cover; display: flex; align-items: center; justify-content: center; color: #000; text-align: center;">
        <h1 style="background: rgba(255, 255, 255, 0.4); padding: 20px; border-radius: 10px;">Эстетика в каждом лепестке</h1>
    </section>

    <section class="container" style="padding: 80px 0;">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 40px;">
            <div>
                <h2 style="font-family: 'Playfair Display'; margin-bottom: 20px; color: #000;">Наша миссия</h2>
                <p>Мы создаем не просто букеты, а эмоции, которые остаются в памяти навсегда.</p>
            </div>
            <div>
                <h2 style="font-family: 'Playfair Display'; margin-bottom: 20px; color: #000;">История студии</h2>
                <p>С 2015 года мы прошли путь от маленькой лавки до ведущей студии флористики.</p>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
